services:
  postgres:
    image: postgres:16-alpine
    container_name: car-rental-postgres

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "${POSTGRES_PORT}:5432"

    volumes:
      - car_rental_data:/var/lib/postgresql/data

volumes:
  car_rental_data: